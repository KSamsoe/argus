# Outpost's UI (the phase 3 gate): the HUD and the inspector in Liberation
# Sans (assets/fonts, under the SIL Open Font License beside it, as Delve
# has it), on the default 960 x 540 canvas.
font = "fonts/LiberationSans-Regular"
text_size = 15

# The colony's colours: cream words on dark wood, buttons of lighter wood
# (systems/art.luau puts the panels on ui/panel and ui/button, which these
# tint), gold for the focus.
[colors]
text = "#F3E8CF"
muted = "#BCA98A"
panel = "#241B14F0"
border = "#8C6A44"
focus = "#FFD27A"
accent = "#E0A050"
button = "#5E4632"
chosen = "#A27840"

[high_contrast_colors]
button = "#000000"
chosen = "#FFFFFF"
