# The kinds of job. A colony founded from these gets a JobKind each, so the
# player (or an agent's sweep) can weigh them while the game runs.
["eat"]
priority = 50
work = 1.0

["sleep"]
priority = 40
work = 100000.0

["cook"]
priority = 6
skill = "cook"
work = 3.0

["harvest"]
priority = 5
skill = "farm"
work = 2.0

["haul"]
priority = 3
work = 0.5

# Felling a tree (systems/woods.luau posts them, Colony.chop_open at a
# time): below the food's jobs, so woodcutters chop only when nothing of
# the colony's food wants them. The logs are hauled like the crops.
["chop"]
priority = 2
skill = "chop"
work = 4.0
