name = "outpost"
clock = "continuous@60"
default_scene = "valley"
plugins = []
# Steam (phase 5 item 9): the daily autosave goes to Steam Cloud too, so a
# colony carries over to another machine.
modules = ["steam"]

# A day is a minute of sim time (decided with Kevin, phase 3): §9's 30-day
# starvation scenario is 108,000 ticks, under a minute a seed at §17's
# 2,000 ticks a second.
[time]
day = 60

# What a player's machine shows of the game (reaching players item 2):
# its title, and an icon from a frame of its sprites, Ada, the first colonist.
[game]
title = "Outpost"
icon = "colonist"
icon_frame = 0
