# Outpost's actions (section 12): the speed controls, pause, and a free
# camera (section 12's "Outpost's free pan-and-zoom").
[actions.speed_1]
type = "button"
doc = "Play at 1x"
[actions.speed_1.bindings]
keyboard = ["1"]

[actions.speed_3]
type = "button"
doc = "Play at 3x"
[actions.speed_3.bindings]
keyboard = ["2"]

[actions.speed_10]
type = "button"
doc = "Play at 10x"
[actions.speed_10.bindings]
keyboard = ["3"]

[actions.pause]
type = "button"
doc = "Pause or go on"
[actions.pause.bindings]
keyboard = ["space"]
gamepad = ["start"]

[actions.pan]
type = "axis2"
doc = "Move the view"
[actions.pan.bindings]
keyboard = ["wasd", "arrows"]
gamepad = ["left_stick"]

[actions.zoom]
type = "axis"
doc = "Zoom in and out"
[actions.zoom.bindings]
keyboard = ["minus/equal"]

# The inspector (the phase 3 gate): Tab opens and closes it, and the menu
# actions move and press in it (and in the menu). While it is open, the
# arrows move its focus instead of the view.
[actions.inspect]
type = "button"
doc = "Open or close the inspector"
[actions.inspect.bindings]
keyboard = ["tab"]
gamepad = ["select"]

# The menu (phase 5 item 2): Escape opens it and the game stands still;
# Escape backs out of it a page at a time. Escape is ui_cancel's too, so
# with the inspector open it backs out of the inspector first, and the menu
# opens once the inspector is closed. Not on the gamepad: Start is pause.
[actions.menu]
type = "button"
doc = "Open the menu, or back out of it a page"
[actions.menu.bindings]
keyboard = ["escape"]

[actions.ui_move]
type = "axis2"
doc = "Move the focus in the inspector or the menu"
[actions.ui_move.bindings]
keyboard = ["arrows", "wasd"]
gamepad = ["dpad"]

[actions.ui_confirm]
type = "button"
doc = "Press the focused button"
[actions.ui_confirm.bindings]
keyboard = ["enter"]
gamepad = ["south"]

[actions.ui_cancel]
type = "button"
doc = "Back out of a page of the inspector or the menu"
[actions.ui_cancel.bindings]
keyboard = ["escape", "backspace"]
gamepad = ["east"]

[actions.ui_click]
type = "button"
doc = "Press the button under the pointer"
[actions.ui_click.bindings]
mouse = ["left"]

[actions.pointer]
type = "pointer"
doc = "Where the mouse is, on the UI canvas"
[actions.pointer.bindings]
mouse = ["position"]

[slots.1]
devices = ["keyboard", "mouse", "gamepad:0"]
