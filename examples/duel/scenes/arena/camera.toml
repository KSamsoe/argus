# The camera: it stays still over the arena, high enough to show all of
# it and its walls, and a little above its middle so the HUD has room at
# the top. 22.5 units high is 24 screen pixels a unit at 960 x 540, so
# each pixel of the art (12 a unit) is drawn as two.
[Transform]
pos = [0.0, 0.875]

[Camera]
height = 22.5

# The dark beyond the walls: what shows wherever nothing is drawn.
[Background]
color = "#080B0D"

# The room's light: a dim cool light everywhere, times level, the braziers'
# warm pools (braziers.toml) and the fighters' own lights on top. The HUD
# is drawn after it, so it stays as bright.
[Lighting]
ambient = "#7F94AE"
level = 0.68
shadows = false

# A point scored (sim.attack's point event): the screen flashes white and
# shakes. Both are passes over the finished picture; nothing in the game
# waits for them.
[PostFlash]
on = "point"
color = "#FFFFFF"
peak = 0.22
decay = 0.4

[PostShake]
on = "point"
trauma = 0.5
decay = 2.5
max_offset = [0.012, 0.012]
