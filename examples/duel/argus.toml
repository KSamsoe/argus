name = "duel"
clock = "continuous@60"
default_scene = "arena"
plugins = []

# The game's icon, on its executable, its window, the Mac app, and a
# phone's home screen: a frame of its sprites, the blue fighter.
[game]
title = "Duel"
icon = "sprites/actors"
icon_frame = 0

# Online, every player's input takes effect 3 ticks (50 ms) after the press.
# Over a slow link (klab's relay on port 7880, 80 to 120 ms each way) that
# corrects a quarter fewer ticks than the engine's 2, and costs one tick of
# answer to each press. More hides a slower link; less answers sooner.
[net]
delay = 3
