# Placeholder sounds as described tones: gameplay never waits on audio files.
[buses]
master = { gain_db = 0 }
music  = { parent = "master", gain_db = -8 }
sfx    = { parent = "master", gain_db = -3 }

[[duck]]                # a hit on the player pulls the music down so it reads
when = "sfx"
duck = "music"
db = -4
attack_ms = 20
release_ms = 300

[spatial]
min_distance = 4
max_distance = 40

[sounds."sfx/shot"]
spatial = false
gain = 0.25
pitch_jitter = 0.06
variations = [ { wave = "square", freq = 900, slide = -2400, ms = 70, release_ms = 30 } ]

[sounds."sfx/pop"]
gain = 0.35
pitch_jitter = 0.15
variations = [ { wave = "noise", ms = 50, release_ms = 40 }, { wave = "triangle", freq = 520, slide = -3000, ms = 60 } ]

[sounds."sfx/hurt"]
spatial = false
gain = 0.8
variations = [ { wave = "saw", freq = 140, slide = -200, ms = 220, release_ms = 120 } ]

[sounds."music/pad"]
variations = [ { wave = "sine", notes = [110, 110, 131, 98], note_ms = 800, attack_ms = 80, release_ms = 200, gain = 0.4 } ]

[sounds."music/arp"]
variations = [ { wave = "square", notes = [440, 523, 659, 523, 440, 392, 330, 392], note_ms = 200, release_ms = 60, gain = 0.15 } ]

[music.swarm]
layers = [ { sound = "music/pad" }, { sound = "music/arp", from = 0.3, to = 0.7 } ]
fade_ms = 800
