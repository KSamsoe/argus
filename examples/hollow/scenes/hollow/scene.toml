# Hollow: three rooms in a row. A cave to start, a tall shaft of planks,
# and a hall with a pit; the camera keeps to whichever room the hero is in.
# Rooms stream around the hero (phase 3 item 6): those within two doorways
# of the hero's room are loaded, the persistent room always is, and the
# rest are not, each remembering what happened in it.
clock = "continuous@60"
seed = 1

[rooms]
start = "a"
radius = 2
follow = "@player"
always = ["persistent"]
# Every room change dips the view a little toward black and back
# (defs/timeline.toml): the game's transition hook.
transition = "timeline:rooms.fade"

[rooms.graph]
"a" = ["b", "deep-0-0"]
"b" = ["a", "c"]
"c" = ["b"]
# The deep (tools/deep.py): each passage once.
