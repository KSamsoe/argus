# Follows the hero, a little above it, and keeps to the room it is in.
# When a cutscene's camera lets go (the outro), the view glides back here
# over blend seconds.
[Transform]
pos = [3.0, 6.0]

[Camera]
height = 12.0
target = "@player"
offset = [0.0, 1.5]
dead_zone = [1.5, 1.0]
blend = 0.8

[CameraShake]

# Falling into the pit is the slice's one impact: a red flash, a screen
# shake, and a hit-stop on the frame the hero is put back, tuned together
# (tune.set, or edit.set). The shake here moves the picture; CameraShake
# above moves the view in the world.
[PostFlash]
on = "player.fell"
color = "#FF3030"
peak = 0.68
decay = 2.0

[PostShake]
on = "player.fell"
trauma = 0.7

[PostHitStop]
on = "player.fell"
frames = 6

# A room change dips toward black and back (the rooms.fade timeline tweens
# its amount; phase 3 item 6).
[PostFade]

# The hollow is dark (phase 5 item 3): a little cold light everywhere, the
# most at the cave mouth, the least in the deep (systems/light.luau glides
# the level to the hero's room), and the hero's lantern for the rest. Rock
# casts shadows from every light that has them.
[Lighting]
ambient = "#8A94B8"
level = 0.6
