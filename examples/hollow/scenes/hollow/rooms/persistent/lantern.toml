# The hero's lantern (phase 5 item 3): carried at their side, so it goes
# wherever they go, and the hollow is lit around them. A warm light that
# flickers a little, and rock casts shadows from it. Its light sits inside
# the hero's collider, never inside a wall the hero leans on (a light in
# the rock would shadow the whole room). It goes out with the hero at the
# way out (systems/light.luau).
[Parent]
entity = "@player"

[Transform]
pos = [0.3, -0.1]

# Where the hierarchy puts it in the world, by the hero.
[GlobalTransform]

[Sprite]
kind = "rect"
size = [0.22, 0.3]
color = "#FFD27A"
z = 5.5

[Emissive]
amount = 1.0

[Light]
color = "#FFB870"
intensity = 1.3
radius = 7.5
falloff = 1.6
flicker = 0.12
