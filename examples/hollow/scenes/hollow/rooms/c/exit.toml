# The way out, at the end of the hall past the pit. Touching it finishes the
# run (systems/run.luau).
[Transform]
pos = [68.5, 2.25]

[Sprite]
atlas = "exit"
size = [1.5, 2.5]

[Collider]
size = [1.0, 2.0]

# Daylight through the arch (phase 5 item 3): the way out shows at its own
# colours in the dark of the hall, and its light spills over the floor
# before it, so the end of the hall reads as somewhere to go.
[Emissive]
amount = 1.0

[Light]
color = "#FFF0C8"
intensity = 1.3
radius = 6.5
falloff = 1.5

[Describe]
name = "exit"
text = "The way out."

# Its words, over it while the hero is near (systems/signs.luau): a UI tree
# hung from the sign itself.
[UiRoot]
follow = "@exit"
follow_offset = [0.0, 1.4]
interactive = false

[UiNode]
pivot = [0.5, 1.0]
pad = [8.0, 5.0]
max = [320.0, 0.0]
visible = false

[UiPanel]
color = "panel"
border = 1.0

[UiText]
key = "sign.exit"
