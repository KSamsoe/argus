# The outro's camera (phase 3 item 5): off until the outro timeline cuts to
# it when the run finishes (defs/timeline.toml). It outranks the hero's
# camera while it is on; the hero's blends back when it goes off.
[Transform]
pos = [61.3, 7.0]

[Camera]
active = false
priority = 5
height = 12.0
bounded = false
blend = 1.0

# Lit as the hero's camera is: the hall's light (systems/light.luau keeps
# its level with the other camera's), so the cut to it does not flash.
[Lighting]
ambient = "#8A94B8"
level = 0.34
