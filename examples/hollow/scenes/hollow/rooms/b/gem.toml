# Something to find at the top of the shaft (the phase 2 playtest's mark:
# "put something up here like a collectible so its not pointless"). It was
# placed off, and proposal 1 turned it on in two places for Kevin to try by
# feel (F9). He kept C (F10): up over the end of the ledge, where only a
# jump reaches it.
[Transform]
pos = [41.5, 21.2]

[Sprite]
atlas = "gem"
size = [0.75, 0.75]
visible = true
z = 1.0

[Collider]
size = [0.75, 0.75]

[Gem]
active = true

[Describe]
name = "gem"
text = "Something glints."

# It glints in the dark of the shaft (phase 5 item 3): drawn at its own
# colour whatever the light, with a little light of its own on the rock
# by it, so it is seen from the planks below. Gone with the gem when it is
# taken (systems/light.luau).
[Emissive]
amount = 1.0

[Light]
color = "#5FE0D0"
intensity = 0.9
radius = 2.5
falloff = 1.5
shadows = false
