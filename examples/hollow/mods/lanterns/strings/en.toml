# The lanterns mod's words (phase 3 item 8), laid over the game's tables:
# its own keys start with lanterns; a key the game has is changed.

[lanterns.keeper]
name = "The lantern keeper"
prompt = "E: talk"
hello = "You found the vigil. I keep the lanterns of the hollow, when there is oil."
