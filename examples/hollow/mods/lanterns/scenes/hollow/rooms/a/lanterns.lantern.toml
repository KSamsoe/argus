# A lantern at the cave mouth (the lanterns mod adds it to the game's
# room): dark until the keeper lights them all.
[Transform]
pos = [4.5, 4.0]

[Sprite]
atlas = "lanterns/lantern"
size = [0.5, 0.8]
color = "#403828"
z = 2.0

[lanterns_Lantern]
phase = 0.7

# Its light (phase 5 item 3): out until the keeper lights it, then warm
# and flickering on the rock around it (systems/flicker.luau).
[Light]
color = "#FFC060"
intensity = 1.0
radius = 4.5
falloff = 1.6
flicker = 0.25
on = false
