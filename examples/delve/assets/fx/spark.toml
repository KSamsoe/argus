# Sparks where a blow lands, and more where something dies: burst by
# systems/look.luau from the hero's emitter at the struck cell, each spark
# one pixel of the art. On the discrete clock a turn is a second, so a
# burst is a spray the turn of the blow and embers drifting out the next.
type = "emitter"
particle = "rect"
max = 400
shape = "circle"
radius = 0.4
lifetime = [1.3, 2.0]
speed = [0.4, 0.9]
spread = 360
drag = 1.2
size = [[0, 0.09], [1, 0.06]]
color = [[0, "#FFF2B8FF"], [0.45, "#FF8A38E0"], [1, "#B0281000"]]
z = 6
material = "fx/glow"
