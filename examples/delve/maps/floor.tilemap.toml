# The floor (phase 5 item 4): a runtime map. Its layers are authored here;
# its cells are the run's, painted by systems/floor.luau from the seed each
# time a floor is made, and carried by keyframes, replays, and saves. No
# chunk folder: nothing writes them to disk.
#
# @floor places it (scenes/delve/floor.toml) so that cell (x, row) is
# centred on world (x, height - 1 - row): rows go down, world y goes up,
# and the hero, the monsters, and the stairs stand on whole numbers.
kind = "tilemap"
runtime = true
width = 40
height = 20
tile_size = 1.0
chunk = 20
cell = 1

# What is drawn: tile 1 on every open cell, a flagstone of tiles/dungeon
# (the stone layer below covers it with the floor's own).
[[layers]]
name = "floor"
tileset = "tiles/dungeon"
z = 0.0

# What blocks: tile 1 on every wall cell. No tileset, so every tile is
# solid and none is drawn (the stone layer draws the walls). The hero's
# moves, the monsters' paths (the navigation grid), the semantic frame's
# tiles, and the shadows the hero's torch casts read this layer.
[[layers]]
name = "walls"
z = 0.0
collision = true

# The art pass: three layers that only draw (no collision), painted by
# systems/floor_art.luau from the walls each time a floor is made. Stone:
# every cell's flagstone, brick face, or rock; shade: the shadow a wall
# casts on the floor beside it; decor: what lies on the floor, and what
# each fight leaves.
[[layers]]
name = "stone"
tileset = "tiles/dungeon"
z = 0.1

[[layers]]
name = "shade"
tileset = "tiles/dungeon"
z = 0.15

[[layers]]
name = "decor"
tileset = "tiles/dungeon"
z = 0.2
