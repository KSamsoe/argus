# The hero: placed by sim.floor when a floor is generated.
tags = ["player"]

[PlayerSlot]
slot = 1

[Actions]

[Transform]
pos = [0.0, 0.0]

[Player]

[Health]
cur = 10
max = 10

# Drawn by tools/art.py: two idle frames and a fallen one, which
# systems/look.luau picks (and tints red when hurt, green when healed).
[Sprite]
atlas = "sprites/hero"
size = [1.0, 1.0]
z = 5.0

# The torch the hero carries (the art pass): the floor is dark but for
# this and the stairs' light, and walls cast shadows from it. It flickers
# a little each turn; sim.look turns it low when the hero falls.
[Light]
color = "#FFB060"
intensity = 1.3
radius = 7.5
falloff = 1.4
flicker = 0.12
height = 1.2

# Sparks where a blow lands, burst by sim.look (fx/spark).
[Emitter]
effect = "fx/spark"
playing = false

# Sounds are heard from the hero, as they were when the camera was the
# hero's (the camera now stands over the floor: scenes/delve/turn.toml).
[AudioListener]

[Describe]
name = "hero"
text = "HP {Health.cur}/{Health.max}, {Player.kills} kills"

# Every floor cell's steps to the hero, which the monsters walk down
# (phase 3 item 2: a flow field, found again when the hero moves).
[NavField]
grid = "@floor"
