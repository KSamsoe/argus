[actions.move]
type = "axis2"
doc = "Step direction; one step is one turn"
[actions.move.bindings]
keyboard = ["arrows"]
gamepad = ["dpad"]

[actions.wait]
type = "button"
doc = "Pass the turn"
[actions.wait.bindings]
keyboard = ["period"]
gamepad = ["east"]

[actions.descend]
type = "button"
doc = "Take the stairs when standing on them"
[actions.descend.bindings]
keyboard = ["enter"]
gamepad = ["south"]

[actions.pause]
type = "button"
doc = "Open or close the menu; while it is open no turn passes"
[actions.pause.bindings]
keyboard = ["escape"]
gamepad = ["start"]

# The menus' actions (the UI reads these names).
[actions.ui_move]
type = "axis2"
doc = "Move the focus in a menu"
[actions.ui_move.bindings]
keyboard = ["arrows"]
gamepad = ["dpad"]

[actions.ui_confirm]
type = "button"
doc = "Press the focused button"
[actions.ui_confirm.bindings]
keyboard = ["enter"]
gamepad = ["south"]

[actions.ui_cancel]
type = "button"
doc = "Back out of a menu"
[actions.ui_cancel.bindings]
keyboard = ["backspace"]

[actions.ui_click]
type = "button"
doc = "Press the button under the pointer"
[actions.ui_click.bindings]
mouse = ["left"]

[actions.pointer]
type = "pointer"
doc = "Where the mouse is, on the UI canvas"
[actions.pointer.bindings]
mouse = ["position"]

[slots.1]
devices = ["keyboard", "mouse", "gamepad:0"]
