# Delve's words (phase 3 item 4): the menu, the HUD line, and the message
# line under it, by key. Holes: {Component.field} and {@id:Component.field}
# from the world; {name} from systems/messages.luau.
language.name = "English"

[menu]
title = "Delve, floor {@player:Player.floor}"
resume = "Resume"
new = "New run"
controls = "Controls"
settings = "Settings"
saves = "Saves"
# Under the buttons: the player's own keys or buttons for the menu, as their
# device names them (rich text's [glyph], reaching players item 3).
hint = "[glyph=ui_move] to choose, [glyph=ui_confirm] to press, [glyph=pause] to go back"

# The menu's controls page (phase 5 item 2): each line is an action and
# what it is bound to.
[controls]
title = "Controls: press one, then a key"
wait = "Wait: {InputBinding.keys}"
descend = "Descend: {InputBinding.keys}"
pause = "Menu: {InputBinding.keys}"
back = "Back"
drink = "Drink: {InputBinding.keys}"

# The menu's settings page (phase 5 item 2); systems/menu_buttons.luau
# fills the holes.
[settings]
title = "Settings"
text = "Text size: {percent}%"
contrast = "High contrast: {state}"
fullscreen = "Fullscreen: {state}"
on = "on"
off = "off"
back = "Back"

# The menu's saves page (2D staples item 4); systems/menu_buttons.luau
# fills the holes from what each save holds.
[saves]
title = "Saves"
slot = "Slot {n}: {what}"
empty = "empty"
held = "floor {floor}, turn {turn}, {kills} kills"
save = "Save"
load = "Load"
delete = "Delete"
back = "Back"

[hud]
line = "Floor {@player:Player.floor}, turn {Turn.n}. HP {@player:Health.cur}/{@player:Health.max}. Potions {@player:Player.potions}."

[message]
hit = "You hit the {monster}."
kill = "You [b]kill[/b] the {monster}."
hurt = "The {monster} hits you for [color=harm]{amount}[/color]."
died = "The {monster} kills you on floor {floor}, after {kills} kills."
descend = "You take the stairs down."
no_stairs = "There are no stairs here."
wall = "A wall."
potion_dropped = "The {monster} drops a potion."
potion_picked = "You pick up a potion; you carry {count}."
potion_drunk = "You drink a potion and heal [color=heal]{amount}[/color], to {hp}/{max}."
potion_full = "You drink a potion, but you are already at full health."
no_potions = "You have no potions to drink."

[monster]
rat = "rat"
bat = "bat"
goblin = "goblin"
