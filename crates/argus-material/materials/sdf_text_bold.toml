type = "material"
doc = "Bold text from a distance field: what rich text's [b] draws a font asset's glyphs with (the UI picks it). As sdf_text, its edge nearer the glyph's middle, so the strokes are thicker."

[params.edge]
type = "f32"
default = 0.42
range = [0.3, 0.7]
doc = "Where the edge is in the field: under 0.5 draws bolder, over draws thinner"

[params.softness]
type = "f32"
default = 1
range = [0.25, 4]
doc = "How wide the edge's blend is, in screen pixels"
