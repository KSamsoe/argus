[package]
name = "argus-ui"
description = "Argus Engine UI: a retained UI tree built from entities and the hierarchy, flexbox layout, pixel and shaped SDF text, nine-slice panels, focus and pointer, drawn over the world"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-ecs = { path = "../argus-ecs", version = "0.0.5" }
argus-sim = { path = "../argus-sim", version = "0.0.5" }
argus-camera = { path = "../argus-camera", version = "0.0.5" }
argus-assets = { path = "../argus-assets", version = "0.0.5" }
argus-os = { path = "../argus-os", version = "0.0.5" }
toml_edit = "0.22"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
rustybuzz = "0.20"

[dev-dependencies]
argus-tween = { path = "../argus-tween", version = "0.0.5" }
argus-input = { path = "../argus-input", version = "0.0.5" }
serde_json = "1"
ttf-parser = "0.25"
