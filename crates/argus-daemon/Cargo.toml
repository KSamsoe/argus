[package]
name = "argus-daemon"
description = "Argus Engine daemon (argusd): the JSON-RPC 2.0 protocol over a local socket or stdio; session, world, scene, edit, sim, script, obs, prof"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "argus_daemon"
path = "src/lib.rs"

[[bin]]
name = "argusd"
path = "src/main.rs"

[features]
default = ["render", "audio"]
# The wgpu renderer: obs.frame, render.window, render.status. Off for a
# headless-only build.
render = ["dep:argus-render", "argus-player/desktop"]
# The mixer and its event log; the output device opens with the window.
audio = ["dep:argus-audio", "argus-player/audio"]

[dependencies]
argus-client = { path = "../argus-client", version = "0.0.1" }
argus-ui = { path = "../argus-ui", version = "0.0.1" }
argus-ecs = { path = "../argus-ecs", version = "0.0.1" }
argus-sim = { path = "../argus-sim", version = "0.0.1" }
argus-luau = { path = "../argus-luau", version = "0.0.1" }
argus-scene = { path = "../argus-scene", version = "0.0.1" }
argus-index = { path = "../argus-index", version = "0.0.1" }
argus-input = { path = "../argus-input", version = "0.0.1" }
argus-assets = { path = "../argus-assets", version = "0.0.1" }
argus-nav = { path = "../argus-nav", version = "0.0.1" }
argus-jobs = { path = "../argus-jobs", version = "0.0.1" }
argus-dialogue = { path = "../argus-dialogue", version = "0.0.1" }
argus-timeline = { path = "../argus-timeline", version = "0.0.1" }
argus-tiles = { path = "../argus-tiles", version = "0.0.1" }
argus-physics = { path = "../argus-physics", version = "0.0.1" }
argus-camera = { path = "../argus-camera", version = "0.0.1" }
argus-post = { path = "../argus-post", version = "0.0.1" }
argus-light = { path = "../argus-light", version = "0.0.1" }
argus-anim = { path = "../argus-anim", version = "0.0.1" }
argus-tween = { path = "../argus-tween", version = "0.0.1" }
argus-particles = { path = "../argus-particles", version = "0.0.1" }
argus-material = { path = "../argus-material", version = "0.0.1" }
argus-test = { path = "../argus-test", version = "0.0.1" }
# The one scene assembly, keyframes, and replay files, shared with every
# player (phase 2 item 7).
argus-player = { path = "../argus-player", version = "0.0.1", default-features = false }
argus-render = { path = "../argus-render", version = "0.0.1", optional = true }
argus-audio = { path = "../argus-audio", version = "0.0.1", optional = true }
serde_json = "1"
toml_edit = "0.22"
interprocess = "2"

[dev-dependencies]
# The player with its renderer and mixer, to check a web mark against this
# daemon's world (phase 2 item 2).
argus-player = { path = "../argus-player" }
