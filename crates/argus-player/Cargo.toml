[package]
name = "argus-player"
description = "Argus Engine player runtime (phase 2 item 7): a project's world assembled one way for the daemon, the web page, and a release build; keyframes and replay files; packs; the bounded recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["render", "audio"]
# Sprite, Describe, and the tile extras the renderer draws.
render = ["dep:argus-render"]
# The mixer, which answers sound requests.
audio = ["dep:argus-audio"]
# The desktop's devices: window events and gamepads in the input layer's
# names, for the daemon's window and a release build.
desktop = ["render", "dep:gilrs"]
# The optional rigid-body module (phase 5 item 7): Rapier, for a game whose
# argus.toml lists modules = ["rigid"]. A build without it does not carry it.
rigid = ["dep:argus-rigid"]

[dependencies]
argus-ui = { path = "../argus-ui", version = "0.1.2" }
argus-os = { path = "../argus-os", version = "0.1.2" }
argus-ecs = { path = "../argus-ecs", version = "0.1.2" }
argus-sim = { path = "../argus-sim", version = "0.1.2" }
argus-luau = { path = "../argus-luau", version = "0.1.2" }
argus-scene = { path = "../argus-scene", version = "0.1.2" }
argus-input = { path = "../argus-input", version = "0.1.2" }
argus-net = { path = "../argus-net", version = "0.1.2" }
argus-assets = { path = "../argus-assets", version = "0.1.2" }
argus-nav = { path = "../argus-nav", version = "0.1.2" }
argus-jobs = { path = "../argus-jobs", version = "0.1.2" }
argus-dialogue = { path = "../argus-dialogue", version = "0.1.2" }
argus-timeline = { path = "../argus-timeline", version = "0.1.2" }
argus-tiles = { path = "../argus-tiles", version = "0.1.2" }
argus-physics = { path = "../argus-physics", version = "0.1.2" }
argus-camera = { path = "../argus-camera", version = "0.1.2" }
argus-post = { path = "../argus-post", version = "0.1.2" }
argus-light = { path = "../argus-light", version = "0.1.2" }
argus-anim = { path = "../argus-anim", version = "0.1.2" }
argus-skeletal = { path = "../argus-skeletal", version = "0.1.2" }
# [build] exclude's patterns (pack.rs).
glob = "0.3"
argus-platform = { path = "../argus-platform", version = "0.1.2" }
argus-tween = { path = "../argus-tween", version = "0.1.2" }
argus-particles = { path = "../argus-particles", version = "0.1.2" }
argus-plugins = { path = "../argus-plugins", version = "0.1.2" }
argus-rigid = { path = "../argus-rigid", version = "0.1.2", optional = true }
argus-render = { path = "../argus-render", version = "0.1.2", optional = true }
argus-audio = { path = "../argus-audio", version = "0.1.2", optional = true }
gilrs = { version = "0.11", optional = true }
toml_edit = "0.22"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vorbis_rs = { version = "0.5", default-features = false }

[dev-dependencies]
# A match through a real relay on this machine.
argus-relay = { path = "../argus-relay", version = "0.1.2" }
# The screen reader's tree, in a test of it.
accesskit = "0.17"
