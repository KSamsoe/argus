[package]
name = "argus-index"
description = "Argus Engine SQLite index: entities by scene, components and fields by entity, references, prefabs, defs, schemas, systems, full-text over doc strings; serves world.* and scene.* reads when the world is not loaded"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-ecs = { path = "../argus-ecs", version = "0.0.5" }
argus-sim = { path = "../argus-sim", version = "0.0.5" }
argus-scene = { path = "../argus-scene", version = "0.0.5" }
rusqlite = { version = "0.40", features = ["bundled"] }
# Exact float parsing: the index stores values as JSON text, and a read
# from it must give the live world's f64 to the last bit (a PostShake default
# of 0.015 came back one step off without it).
serde_json = { version = "1", features = ["float_roundtrip"] }
toml_edit = "0.22"

[dev-dependencies]
argus-luau = { path = "../argus-luau", version = "0.0.5" }
