[package]
name = "argus-cli"
description = "Argus Engine CLI (argus): every daemon method as a subcommand, help generated from the daemon's own method table"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "argus_cli"
path = "src/lib.rs"

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
argus-daemon = { path = "../argus-daemon", version = "0.0.1" }
argus-sim = { path = "../argus-sim", version = "0.0.1" }
serde_json = "1"
interprocess = "2"

[dev-dependencies]
argus-ecs = { path = "../argus-ecs", version = "0.0.1" }
