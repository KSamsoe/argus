[package]
name = "argus-test"
description = "Argus Engine scenario test runner: tests/*.luau scenarios with state goldens and seed sweeps, run headless through the protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mlua = { version = "0.10", features = ["luau", "serialize"] }
serde_json = "1"

[dev-dependencies]
argus-daemon = { path = "../argus-daemon", version = "0.0.7" }
argus-ecs = { path = "../argus-ecs", version = "0.0.7" }
