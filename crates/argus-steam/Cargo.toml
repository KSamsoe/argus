[package]
name = "argus-steam"
description = "Argus Engine's Steam platform: achievements, cloud saves, rich presence, input glyphs, and the overlay through Steamworks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argus-ecs = { path = "../argus-ecs", version = "0.0.6" }
argus-assets = { path = "../argus-assets", version = "0.0.6" }
argus-platform = { path = "../argus-platform", version = "0.0.6" }
argus-input = { path = "../argus-input", version = "0.0.6" }
serde_json = "1"
# Valve's Steamworks SDK, through steamworks-rs (downloaded with Kevin's
# approval, 2026-10-08): the bindings and the SDK's steam_api libraries.
steamworks = "0.13.1"
# Its raw calls, for what steamworks-rs does not wrap (achievement progress,
# Steam Input's button pictures).
steamworks-sys = "0.13.0"
