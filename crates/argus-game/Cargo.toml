[package]
name = "argus-game"
description = "Argus Engine release executable (phase 2 item 7): a game from its packs in a window, with no protocol, no index, and no .argus/; the report key and a crash save replay files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "argus-game"
path = "src/main.rs"

[features]
# The rigid-body module, for a game whose argus.toml lists it (argus build
# passes it).
rigid = ["argus-player/rigid"]
# Steam, for a game whose argus.toml lists modules = ["steam"] (phase 5
# item 9): the game runs on it when Steam is there, on the null platform
# when it is not.
steam = ["dep:argus-steam"]

[dependencies]
argus-player = { path = "../argus-player", version = "0.0.4", features = ["desktop"] }
argus-plugins = { path = "../argus-plugins", version = "0.0.4" }
argus-render = { path = "../argus-render", version = "0.0.4" }
argus-ui = { path = "../argus-ui", version = "0.0.4" }
argus-input = { path = "../argus-input", version = "0.0.4" }
argus-scene = { path = "../argus-scene", version = "0.0.4" }
argus-sim = { path = "../argus-sim", version = "0.0.4" }
argus-platform = { path = "../argus-platform", version = "0.0.4" }
argus-steam = { path = "../argus-steam", version = "0.0.4", optional = true }
serde_json = "1"
