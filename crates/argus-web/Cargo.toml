[package]
name = "argus-web"
description = "Argus Engine web player (phase 2 items 1 and 7): argus-player's world stepped by the page and drawn into a canvas with WebGPU or WebGL2"
version.workspace = true
edition.workspace = true
license.workspace = true

# The wasm module is a cdylib, asked for by tools/web/build.sh (`cargo rustc
# --crate-type cdylib`); natively it is a library, since a Windows DLL of it
# would export more symbols than a DLL may hold.

[features]
# The rigid-body module, for a game whose argus.toml lists it.
rigid = ["argus-player/rigid"]

[dependencies]
argus-player = { path = "../argus-player", version = "0.1.1" }
argus-os = { path = "../argus-os", version = "0.1.1" }
argus-ecs = { path = "../argus-ecs", version = "0.1.1" }
argus-sim = { path = "../argus-sim", version = "0.1.1" }
argus-render = { path = "../argus-render", version = "0.1.1" }
argus-ui = { path = "../argus-ui", version = "0.1.1" }
argus-audio = { path = "../argus-audio", version = "0.1.1" }
argus-input = { path = "../argus-input", version = "0.1.1" }
argus-luau = { path = "../argus-luau", version = "0.1.1" }
serde_json = "1"
# The determinism spike's reference (phase 5 item 11): musl's math in pure
# Rust, the same bits on every platform; already in the tree.
libm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# cpal's WebAudio host, for argus-audio's device in the browser.
cpal = { version = "0.15", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement"] }
