[package]
name = "argus-assets"
description = "Argus Engine asset importer: assets/ with sidecar TOML (sprite frames, pivots, clips; sound variation sets; described-shape placeholders), validation warnings, a cache in .argus/, and a watcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-os = { path = "../argus-os", version = "0.0.7" }
argus-ecs = { path = "../argus-ecs", version = "0.0.7" }
argus-audio = { path = "../argus-audio", version = "0.0.7", default-features = false }
argus-material = { path = "../argus-material", version = "0.0.7" }
toml_edit = "0.22"
png = "0.17"
serde_json = "1"
ttf-parser = "0.25"
# An Aseprite file's compressed cels (zlib); already built for png.
flate2 = "1"
# Tiled's XML files (.tmx, .tsx), phase 5 item 4.
quick-xml = "0.41"
# Art scripts (assets/*.art.luau): a sandboxed Luau, its math from libm.
mlua = { version = "0.10", features = ["luau"] }
libm = "0.2"

[dev-dependencies]
# The tests write WAV fixtures.
hound = "3"
