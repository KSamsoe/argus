[package]
name = "argus-assets"
description = "Argus Engine asset importer: assets/ with sidecar TOML (sprite frames, pivots, clips; sound variation sets; described-shape placeholders), validation warnings, a cache in .argus/, and a watcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-os = { path = "../argus-os", version = "0.0.1" }
argus-ecs = { path = "../argus-ecs", version = "0.0.1" }
argus-audio = { path = "../argus-audio", version = "0.0.1", default-features = false }
argus-material = { path = "../argus-material", version = "0.0.1" }
toml_edit = "0.22"
png = "0.17"
serde_json = "1"
ttf-parser = "0.25"

[dev-dependencies]
# The tests write WAV fixtures.
hound = "3"
