[package]
name = "argus-tiles"
description = "Argus Engine tilemaps: layers over a grid in sparse chunk files with a text index, rect edits, auto-tiling rules from the tileset, collision from tile properties"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-os = { path = "../argus-os", version = "0.2.0" }
argus-ecs = { path = "../argus-ecs", version = "0.2.0" }
argus-assets = { path = "../argus-assets", version = "0.2.0" }
toml_edit = "0.22"
serde_json = "1"
