[package]
name = "argus-rigid"
description = "Argus Engine's optional dynamic physics tier: rigid bodies and joints on Rapier, sharing the world with the overlap and kinematic tiers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argus-ecs = { path = "../argus-ecs", version = "0.2.1" }
argus-sim = { path = "../argus-sim", version = "0.2.1" }
argus-tiles = { path = "../argus-tiles", version = "0.2.1" }
argus-physics = { path = "../argus-physics", version = "0.2.1" }
# The same run reaches the same world on every platform the engine runs on
# (libm for every transcendental), and the state serialises for replays.
rapier2d = { version = "0.36", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
