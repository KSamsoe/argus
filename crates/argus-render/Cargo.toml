[package]
name = "argus-render"
description = "Argus Engine renderer: wgpu instanced sprites from atlases, windowed and offscreen targets, interpolation between sim states"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-ui = { path = "../argus-ui", version = "0.0.8" }
argus-os = { path = "../argus-os", version = "0.0.8" }
argus-ecs = { path = "../argus-ecs", version = "0.0.8" }
argus-camera = { path = "../argus-camera", version = "0.0.8" }
argus-assets = { path = "../argus-assets", version = "0.0.8" }
argus-particles = { path = "../argus-particles", version = "0.0.8" }
argus-post = { path = "../argus-post", version = "0.0.8" }
argus-light = { path = "../argus-light", version = "0.0.8" }
argus-material = { path = "../argus-material", version = "0.0.8" }
serde_json = "1"
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
# The UI for the player's screen reader (phase 5 item 2).
accesskit = "0.17"

# The window's bridge to it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit_winit = "0.23"

# The web player (phase 2 item 1): WebGPU with a WebGL2 fallback, into a canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24", features = ["webgl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[dev-dependencies]
argus-input = { path = "../argus-input", version = "0.0.8" }
argus-sim = { path = "../argus-sim", version = "0.0.8" }
