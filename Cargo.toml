[workspace]
resolver = "2"
members = ["crates/argus-ecs", "crates/argus-ecs-derive", "crates/argus-os", "crates/argus-sim", "crates/argus-luau", "crates/argus-scene", "crates/argus-index", "crates/argus-input", "crates/argus-daemon", "crates/argus-test", "crates/argus-cli", "crates/argus-render", "crates/argus-audio", "crates/argus-assets", "crates/argus-tiles", "crates/argus-physics", "crates/argus-camera", "crates/argus-post", "crates/argus-light", "crates/argus-anim", "crates/argus-tween", "crates/argus-particles", "crates/argus-material", "crates/argus-web", "crates/argus-player", "crates/argus-game", "crates/argus-ui", "crates/argus-nav", "crates/argus-jobs", "crates/argus-dialogue", "crates/argus-timeline", "crates/argus-client", "crates/argus-editor", "crates/argus-plugin", "crates/argus-plugins", "crates/argus-rigid", "crates/argus-skeletal", "crates/argus-platform", "crates/argus-steam"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KSamsoe/argus"

[profile.release]
debug = 1

# Debug builds keep line tables only: file and line in a backtrace, which is
# what the tests and the daemon's panics use. Full debug info in every test
# binary, and every stale build of one, had target/debug at 213 GB by the
# phase 3 gate (the disk filled twice).
[profile.dev]
debug = "line-tables-only"

# What `argus build --release` makes for players (phase 2 item 7): the
# release build without debug info. A crash report carries the panic's
# message and place, and script errors their file and line, without it.
[profile.ship]
inherits = "release"
debug = false
strip = true

# Pictures are compressed in debug builds too (a mark's clip, obs.frame):
# unoptimized, deflate is several times slower, and a mark's clip made
# the game stall for most of a second (phase 2 item 2).
# The Luau VM is optimized in debug builds too (phase 3 item 3): Outpost's
# thirty-day, twenty-seed balance scenario is two million ticks of scripts,
# and an unoptimized interpreter made a test run of it take over twenty
# minutes.
[profile.dev.package.luau0-src]
opt-level = 3
[profile.dev.package.mlua-sys]
opt-level = 3
[profile.dev.package.mlua]
opt-level = 3
[profile.dev.package.argus-ecs]
opt-level = 2
[profile.dev.package.argus-sim]
opt-level = 2
[profile.dev.package.argus-luau]
opt-level = 2
[profile.dev.package.argus-nav]
opt-level = 2
[profile.dev.package.argus-jobs]
opt-level = 2
# The UI's layout runs every tick a game has a UI (Outpost's inspector,
# found at the phase 3 gate: a debug tick doubled by it).
[profile.dev.package.argus-ui]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 3

# The editor is optimized in debug builds too (phase 4 item 1): Kevin's
# first play in its viewport was slow, and a debug frame of the editor
# took 18 ms, most of it egui laying out and painting the panels and
# turning a frame's pixels into colours. wgpu's core checks every call,
# which the daemon's renderer and the editor's both pay.
[profile.dev.package.argus-editor]
opt-level = 2
[profile.dev.package.argus-client]
opt-level = 2
[profile.dev.package.egui]
opt-level = 2
[profile.dev.package.epaint]
opt-level = 2
[profile.dev.package.emath]
opt-level = 2
[profile.dev.package.ecolor]
opt-level = 2
[profile.dev.package.eframe]
opt-level = 2
[profile.dev.package.egui-wgpu]
opt-level = 2
[profile.dev.package.egui-winit]
opt-level = 2
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 2
[profile.dev.package.wgpu]
opt-level = 2
[profile.dev.package.wgpu-core]
opt-level = 2
[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
