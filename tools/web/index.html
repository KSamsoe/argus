<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<style>
  body { margin: 0; background: #16141c; color: #c9c4d6; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  canvas { display: block; margin: 12px auto 0; width: 960px; height: 540px; max-width: 100%; outline: none; background: #000; }
  p, form { max-width: 960px; margin: 8px auto; padding: 0 12px; }
  form { display: flex; gap: 8px; }
  /* An author's display beats the hidden attribute's own (the browser's
     display: none), so the report form showed from the start (issue 3). */
  [hidden] { display: none !important; }
  form input { flex: 1; font: inherit; padding: 6px 8px; background: #22202b; color: #f0ecf8; border: 1px solid #ffc440; }
  form button { font: inherit; padding: 6px 10px; background: #2d2a38; color: #f0ecf8; border: 1px solid #5a5570; cursor: pointer; }
  #said { color: #8fdca0; min-height: 1.4em; }
  /* For the screen reader only: off the screen, not hidden from it. */
  .reader { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
</style>
<canvas id="game" width="960" height="540" tabindex="0" role="application" aria-label="The game" aria-describedby="reader-said"></canvas>
<!-- The game for a screen reader (phase 5 item 2): its buttons, and what changes. -->
<div class="reader">
  <div id="reader-buttons"></div>
  <div id="reader-said" aria-live="polite"></div>
  <div id="reader-hud" aria-live="polite"></div>
</div>
<form id="report" hidden>
  <input id="note" maxlength="300" autocomplete="off" placeholder="What just happened? Enter sends, Esc goes back to the game.">
  <button type="submit">Send report</button>
  <button type="button" id="cancel">Cancel</button>
</form>
<p id="said"></p>
<p id="status">Loading.</p>
<!-- argus build writes the game's own controls (its input.toml) into #controls. -->
<p><span id="controls">Click the game first.</span> <span id="f8">Press F8 when something feels wrong: the game pauses and asks what happened, and the last half minute goes to the developer with your note.</span></p>
<script type="module" src="main.js"></script>
