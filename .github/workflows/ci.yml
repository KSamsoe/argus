# CI on the reference laptop (phase 5 item 0): a self-hosted runner there
# (docs/ci.md) runs tools/ci/ci.sh. Section 17's targets are numbers on
# that laptop, so they are gated there. It runs when started by hand
# (Actions, ci, Run workflow): Kevin decided (2026-10-07) that a run on
# every push, about forty minutes, slows private work too much, and that
# pushes run it again once there are public builds.
name: ci
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: [self-hosted, windows, argus-reference]
    timeout-minutes: 150
    defaults:
      run:
        # cmd, to start Git's bash by its full path: `shell: bash` can find
        # WSL's or Cygwin's first on this laptop.
        shell: cmd
    steps:
      # The build caches stay between runs (a cold build is most of an
      # hour); everything else is cleaned, as a fresh checkout would be.
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Clean all but the build caches
        run: git clean -ffdx -e /target -e /target-web
      - name: CI
        run: '"C:\Program Files\Git\bin\bash.exe" tools/ci/ci.sh'
      - name: Keep the logs and pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.run_number }}
          path: |
            target/ci/
            target-web/check/
            examples/*/.argus/test-images/
            examples/*/.argus/replays/
          if-no-files-found: ignore
          retention-days: 14
