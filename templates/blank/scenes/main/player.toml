# The player: the entity with the input slot, and the camera follows it.
tags = ["player"]

[PlayerSlot]
slot = 1

[Actions]

[Player]
speed = 6.0

[Transform]
pos = [0.0, 0.0]

# Drawn by assets/player.art.luau, a script of rows of pixels; size is
# how big it is in world units, whatever the art's pixels. To use art from
# a paint program, put player.png (and a player.toml cutting it into the
# same frames and clips) in its place, and nothing else changes.
[Sprite]
atlas = "player"
size = [2.0, 2.0]
z = 2.0

# Picks the frames: assets/anim/player.toml plays walk while the player
# walks and idle when they stop, and mirrors it while they walk left.
[Animator]
machine = "anim/player"

# 15 units top to bottom: 36 screen pixels a unit at 540 tall, so each of
# the art's pixels (9 a unit) is drawn as a 4 x 4 square.
[Camera]
height = 15.0

# What shows past the floor's edge, wherever nothing is drawn.
[Background]
color = "#0E1316"
