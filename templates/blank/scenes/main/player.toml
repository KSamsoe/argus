# The player: the entity with the input slot, and the camera follows it.
tags = ["player"]

[PlayerSlot]
slot = 1

[Actions]

[Player]
speed = 6.0

[Transform]
pos = [0.0, 0.0]

# Drawn from assets/player.png, cut into frames by its sidecar
# assets/player.toml; size is how big it is in world units, whatever the
# image's pixels. To use your own art, replace player.png (keep the frames
# in a row, or change the sidecar's grid) and nothing else changes.
[Sprite]
atlas = "player"
size = [2.0, 2.0]
z = 2.0

# Picks the frames: assets/anim/player.toml plays walk while the player
# walks and idle when they stop; systems/look.luau mirrors it when they
# walk left.
[Animator]
machine = "anim/player"

# 15 units top to bottom: 36 screen pixels a unit at 540 tall, so each of
# the art's pixels (9 a unit) is drawn as a 4 x 4 square.
[Camera]
height = 15.0

# What shows past the floor's edge, wherever nothing is drawn.
[Background]
color = "#0E1316"
