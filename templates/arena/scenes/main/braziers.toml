# A brazier on each corner pillar of the walls: the room's light. Only a
# look. Each is a picture (frame 21 of sprites/actors), a Light that
# flickers, and an Emitter that keeps throwing flames (fx/flame). The
# camera's Lighting (camera.toml) is the dim light everywhere else; a
# brighter room is a higher Lighting.level there, a warmer or wider pool
# is a Light's color or radius here.
[Transform]
pos = [0.0, 0.0]

[children.nw.Transform]
pos = [-16.125, 9.875]

[children.nw.Sprite]
atlas = "sprites/actors"
frame = 21
size = [1.0, 1.0]
z = 4.5

[children.nw.Emissive]

[children.nw.Light]
color = "#FFA050"
intensity = 2.0
radius = 10.0
falloff = 1.2
flicker = 0.2
shadows = false

[children.nw.Emitter]
effect = "fx/flame"

