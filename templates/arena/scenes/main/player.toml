# The hero: the one entity with an input slot, so it gets the Actions of
# player 1 every tick. Its numbers (speed, fire rate, range) are in the
# Player component: try them in the editor's tuning panel, then write the
# ones you like here.
tags = ["player"]

[PlayerSlot]
slot = 1

[Actions]

[Transform]
pos = [0.0, 0.0]

[Player]
speed = 7.0
fire_every = 12
range = 12.0

[Health]
cur = 5
max = 5

# Its picture: a frame of sprites/actors (assets/sprites/actors.art.luau
# draws them), which systems/looks.luau picks each tick, drawn at its own
# colour whatever the light (fx/body). The size is also the hero's body:
# sim.move keeps it inside the walls by it, so change it only with that in
# mind.
[Sprite]
atlas = "sprites/actors"
frame = 3
size = [1.0, 1.0]
material = "fx/body"
z = 2.0

# The light it carries: the floor round it is lit wherever it goes. Only a
# look (the camera's Lighting turns lights on).
[Light]
color = "#FFE2B0"
intensity = 1.1
radius = 9.0
falloff = 1.4
shadows = false

# Its shadow, under its feet (frame 20). Only a look.
[children.shadow.Transform]
pos = [0.0, -0.4167]

[children.shadow.Sprite]
atlas = "sprites/actors"
frame = 20
size = [0.8333, 0.3333]
z = 0.5
