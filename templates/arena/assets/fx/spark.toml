# Sparks where a bullet hits an enemy: systems/looks.luau starts one of
# these where each hit lands. It throws its burst at once, and its entity
# is gone when the last spark is. Each spark is frame 18 of
# sprites/actors, glowing (fx/glow), white, then the bullets' yellow, then
# gone. More sparks: raise burst; longer: raise lifetime.
type = "emitter"
sprite = "sprites/actors"
frame = 18
burst = 9
max = 16
lifetime = [0.12, 0.3]
speed = [4, 10]
spread = 360
drag = 6
size = [[0, 0.3], [1, 0.05]]
color = [[0, "#FFFFFFFF"], [0.35, "#FFD866E0"], [1, "#FF7A3000"]]
z = 3.5
material = "fx/glow"
