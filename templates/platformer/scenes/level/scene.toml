# The level: about two screens of side-on platforming, left to right.
# Every other file in this folder is one entity; its file name is its id
# (player.toml is @player).
#
#   x  0      the left wall, the hero starts at x 3
#   x  1-16   solid ground
#   x 16-19   the pit: fall in and you start again
#   x 19-36   ground again, with spikes at x 25-27
#   x 36-48   a ledge 2.5 high to jump up to, the flag on it at x 46
#   x 48      the right wall
#
# World units are y up, and the hero is 0.8 wide and 1.2 tall. The ground's
# top is y 0.
clock = "continuous@60"
seed = 1

# The camera keeps its view inside this rect [x0, y0, x1, y1]: widen it
# when the level grows.
bounds = [0.0, -4.0, 49.0, 12.0]
