# The flag's cloth: a child of the pole (@goal). With a Parent and a
# GlobalTransform, its Transform is relative to the parent: up near the
# top of the pole, to its right. Move the pole and the cloth goes with it.
[Parent]
entity = "@goal"

[Transform]
pos = [0.7, 0.95]

# Where the engine puts it in the world, worked out from the parent's.
[GlobalTransform]

# Four frames of assets/sprites (assets/sprites.art.luau draws them),
# waving: the animator assets/anim/flag.toml plays them round and round.
[Sprite]
atlas = "sprites"
frame = 17
size = [1.1333333, 0.7333333]
z = 1.0

[Animator]
machine = "anim/flag"
