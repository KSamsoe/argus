# The pause panel's words, a child of @pause, so it shows and hides with it.
# On the HUD's panel (assets/ui/panel.art.luau draws it), nine-sliced as
# hud.toml says.
[Parent]
entity = "@pause"

[UiNode]
pad = [36.0, 22.0]

[UiPanel]
image = "ui/panel"
slice = 4.0
scale = 3.0

[UiText]
text = "Paused. Press Esc to go on."
align = "center"
color = "#F6E7C1"
