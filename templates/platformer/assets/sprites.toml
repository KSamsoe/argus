# Everything in the level, one atlas: written by tools/art.py with
# sprites.png, so change that and run it rather than editing this.
# 15 pixels a world unit. The frames, from 0:
#   0-8 the hero: idle (2), run (4), jump, fall, land
#   9-16 the coin turning
#   17-20 the flag's cloth waving
#   21 the flag's pole, 22 the spikes
#   23-25 grass tiles, 26-30 earth tiles, 31 a side, 32 a grass corner,
#   33 an underside, 34 a plank (systems/looks.luau lays these)
#   35 a sparkle (assets/fx/sparkle.toml)
# The spikes' pivot is the middle of their foot, so prefabs/spikes.toml
# stands them on the ground where its Transform is.
pixels_per_unit = 15

