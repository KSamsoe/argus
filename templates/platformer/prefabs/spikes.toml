# A row of spikes, about two units wide: touching it sends the hero back to
# the start (the Hazard; systems/hazards.luau). The Collider is the touch,
# flat along the ground. The Sprite is the picture: four steel teeth with
# red tips, a frame of assets/sprites (assets/sprites.art.luau draws it).
# That frame's pivot is the middle of its foot (the script says so), so the
# teeth stand on the ground where the Transform is.
[Sprite]
atlas = "sprites"
frame = 22
size = [1.8666667, 0.6666667]
z = 1.0

[Collider]
size = [1.8, 0.4]
offset = [0.0, 0.2]

[Hazard]

[Describe]
name = "spikes"
