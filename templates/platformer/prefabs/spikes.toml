# A row of spikes, two units wide: touching it sends the hero back to the
# start (the Hazard; systems/hazards.luau). The entity itself is only the
# touch: a Collider, flat along the ground. What shows is its four teeth,
# children placed relative to it: squares turned 45 degrees, half sunk
# behind the ground (a lower z), so each shows as a triangle. A child's
# Transform is relative to its parent only when it also has a
# GlobalTransform (the engine fills that in: where it is in the world).
[Collider]
size = [1.8, 0.4]
offset = [0.0, 0.2]

[Hazard]

