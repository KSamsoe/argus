name = "roguelike"
# Discrete: the game moves one turn at a time, a turn for each key the
# player presses (and `argus run turns=n` for an agent or a test).
clock = "discrete"
default_scene = "dungeon"
plugins = []

# The game's icon, on its executable, its window, the Mac app, and a
# phone's home screen: a frame of its sprites, the hero. Its title is its
# name unless [game] title says otherwise.
[game]
icon = "sprites/creatures"
icon_frame = 0
