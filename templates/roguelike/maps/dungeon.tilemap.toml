# The dungeon's grid: a runtime map. Its layers are set here; its cells are
# the run's, painted by systems/dungeon.luau from the picture at its top
# (so to change the dungeon, change that picture, not this file). Keyframes,
# replays, and saves carry the cells, so nothing is written to disk.
#
# width and height must be the picture's size: change them with it.
kind = "tilemap"
runtime = true
width = 30
height = 11
tile_size = 1.0
chunk = 16
cell = 1

# The game's two layers, which sim.dungeon paints and the rules read.
#
# floor: tile 1 on every open cell, a plain flagstone of tiles/dungeon. It
# is drawn, but the stone layer below covers it with the look's own.
[[layers]]
name = "floor"
tileset = "tiles/dungeon"
z = 0.0

# walls: tile 1 on every wall cell. No tileset, so it is never drawn (the
# stone layer draws the walls) and every tile in it is solid. The hero's
# moves, the monsters' way to the hero (the navigation grid), and the
# semantic frame all read this layer.
[[layers]]
name = "walls"
z = 0.0
collision = true

# The look's two layers, which only draw (nothing collides with them),
# painted by systems/look.luau from the walls each time a run begins.
# stone: every cell's flagstone, brick face, or rock; shade: the shadow a
# wall casts on the floor beside it.
[[layers]]
name = "stone"
tileset = "tiles/dungeon"
z = 0.1

[[layers]]
name = "shade"
tileset = "tiles/dungeon"
z = 0.2
