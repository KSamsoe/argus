# The message line under the HUD: what the last turn did ("You hit the
# rat."), written by sim.messages (systems/messages.luau). The text here is
# what it says before the first turn.
[UiRoot]
interactive = false
layer = 1

[UiNode]
absolute = true
offset = [10.0, 36.0]
pad = [8.0, 4.0]

[UiPanel]
color = "#05070A80"

[UiText]
text = "You enter the dungeon. Arrows or WASD to move, walk into a monster to attack."
