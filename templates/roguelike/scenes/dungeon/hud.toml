# The line along the top of the screen. It needs no script: the holes
# {@id:Component.field} are filled from the world every frame. Add a field
# to show by adding a hole.
[UiRoot]
interactive = false

[UiNode]
absolute = true
offset = [10.0, 10.0]
pad = [14.0, 7.0]

# On an iron-framed plate (assets/ui/panel.png, drawn by tools/art.py):
# its outer 4 pixels keep their size and its middle stretches (a
# nine-slice), at two screen pixels an image pixel.
[UiPanel]
image = "ui/panel"
slice = 4.0
scale = 2.0

[UiText]
text = "Turn {@turn:Turn.n}    HP {@player:Health.cur}/{@player:Health.max}    Kills {@player:Player.kills}"
color = "accent"
