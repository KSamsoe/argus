# The UI's colours: the theme every UiText and UiPanel draws from when it
# names a colour (accent) or none (text). The words are in the built-in
# pixel font, which suits the pixel art; the plates they sit on are
# drawn by assets/ui/panel.art.luau and plate.art.luau. Change a colour
# here and every line follows.
[colors]
text = "#E6DCC4"
muted = "#9C93AC"
accent = "#F0CC84"
