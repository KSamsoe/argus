# A tree: a Source of wood that only a colonist with the chop skill fells
# (a chop job). Felled, it is a stump until it grows back. It blocks the
# way (NavCost, cost 0), so a woodcutter works it from beside it.
[Source]
job_kind = "chop"
gives = "wood"
yield = 2.0
regrow_days = 2.0
# The colours its Sprite is tinted standing and felled, and its logs'.
# White draws the art as assets/sprites/meadow.art.luau painted it.
ripe_color = "#FFFFFF"
bare_color = "#FFFFFF"
drop_color = "#FFFFFF"

[NavCost]
cost = 0

# An oak or a fir of sprites/meadow (systems/looks.luau picks which by where
# it stands, and how grown by Source.growth), its trunk's foot on its cell,
# its crown over the cells above.
[Sprite]
atlas = "sprites/meadow"
frame = 4
size = [2.1111, 3.0]
z = 1.0

[Describe]
name = "tree"
text = "grown {Source.growth}"
