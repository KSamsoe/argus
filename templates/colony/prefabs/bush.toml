# A berry bush: a Source of food that anyone can gather (a gather job).
# Ripe it is red with berries; picked, it is green until it grows back,
# flowering and then in green berries on the way (systems/looks.luau picks
# the frame of sprites/meadow by Source.growth).
#
# To change first: yield (food a picking gives) and regrow_days.
[Source]
job_kind = "gather"
gives = "food"
yield = 2.0
regrow_days = 1.0
# The colours its Sprite is tinted ripe and picked, and its goods'. White
# draws the art as assets/sprites/meadow.art.luau painted it.
ripe_color = "#FFFFFF"
bare_color = "#FFFFFF"
drop_color = "#FFFFFF"

# Drawn a little bigger than the bush itself, its base where it stands.
[Sprite]
atlas = "sprites/meadow"
frame = 3
size = [1.4444, 1.3333]
z = 1.0

[Describe]
name = "berry bush"
text = "grown {Source.growth}"
