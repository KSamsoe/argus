name = "colony"
clock = "continuous@60"
default_scene = "main"
plugins = []

# How long a day is, in sim seconds: a minute. Scripts read it as
# q.day_length, and scenarios count in days(n). Make it longer for a slower
# colony; the hunger and regrowth rules are per day, so they keep pace.
[time]
day = 60

# The game's icon, on its executable, its window, the Mac app, and a
# phone's home screen: a frame of its sprites, Ada, the first colonist. Its title is its
# name unless [game] title says otherwise.
[game]
icon = "sprites/colonists"
icon_frame = 0
