# The line at the top of the screen. systems/hud.luau writes its words; the
# UI components place it (UiNode), give it a backing (UiPanel), and draw
# the text (UiText). interactive = false: it takes no focus or clicks.
[UiRoot]
interactive = false
layer = 1

[UiNode]
absolute = true
offset = [12.0, 8.0]
pad = [8.0, 4.0]

[UiPanel]
color = "#05070A99"

[UiText]
text = ""
