# The view: the whole meadow. The pan and zoom actions (input.toml) move it.
[Transform]
pos = [15.5, 9.0]

[Camera]
height = 20.0
pan_action = "pan"
pan_speed = 0.8
zoom_action = "zoom"
zoom_min = 6.0
zoom_max = 40.0
bounded = false

# What shows past the meadow when zoomed out: the long grass round it
# (the darkest grass assets/sprites/ground.art.luau draws), so it goes on.
[Background]
color = "#2C4724"

# Light, for the lantern at the store: white everywhere, so by day the
# meadow is drawn as it is; at night the lantern's Light (scenes/main/
# colony.toml) warms the dark round the stockpile (systems/looks.luau).
[Lighting]
ambient = "#FFFFFF"
level = 1.0
shadows = false
