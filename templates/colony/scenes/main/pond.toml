# A pond: water nobody walks through. NavCost with cost 0 blocks the grid's
# cells under its size, so colonists going to the trees walk around it.
[NavCost]
cost = 0
size = [5.0, 4.0]

[Transform]
pos = [22.0, 12.5]

# The water and its bank (sprites/meadow): the bank half a unit round the
# 5 x 4 that blocks the way. systems/looks.luau moves its ripples.
[Sprite]
atlas = "sprites/meadow"
frame = 30
size = [6.0, 5.0]
z = -4.0

[Describe]
name = "pond"
